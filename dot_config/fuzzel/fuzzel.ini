include =  ~/.config/fuzzel/colors.ini
font=monospace
dpi-aware=auto

use-bold=yes
prompt="-> "
placeholder=app name..
icon-theme=hicolor
icons-enabled=yes
fields=name
password-character=⦿
terminal=footclient --
anchor=center
horizontal-pad=75

[border]
width=3
radius=0

[dmenu]
mode=index # text|index
exit-immediately-if-empty=yes

[key-bindings]
